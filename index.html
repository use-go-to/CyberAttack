<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les attaques informatiques – Mission 6</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#f6f6f7;--mute:#a9a9b1;--dim:#7a7a82;--line:rgba(255,255,255,.14);--fill:rgba(255,255,255,.04);--sans:'Archivo','Segoe UI',Arial,sans-serif;--mono:'IBM Plex Mono',Consolas,monospace;--e:cubic-bezier(.2,.7,.2,1);--a:#e5252a;--al:rgba(229,37,42,.16)}
.fr{--a:#e5252a;--al:rgba(229,37,42,.16);--t:#fff}.fb{--a:#3fb8d6;--al:rgba(63,184,214,.15);--t:#021015}.fy{--a:#f0b429;--al:rgba(240,180,41,.14);--t:#150f00}.fg{--a:#5fd39a;--al:rgba(95,211,154,.13);--t:#02140b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:radial-gradient(1200px 700px at 85% 5%,#16161d,#000)}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;padding:80px 120px 112px;opacity:0;visibility:hidden;transform:translateX(40px);transition:opacity .5s var(--e),transform .6s var(--e),visibility 0s .6s}
.slide.before{transform:translateX(-40px)}
.slide.active{opacity:1;visibility:visible;transform:none;transition:opacity .5s var(--e),transform .6s var(--e),visibility 0s}
.slide::before{content:"";position:absolute;left:0;top:84px;width:16px;height:80px;background:var(--a)}
.tag{display:inline-block;font-size:22px;font-weight:600;padding:6px 16px;border-radius:999px;background:var(--a);color:var(--t)}
h2{font-size:64px;line-height:1.05;font-weight:800;font-stretch:108%;letter-spacing:-.02em;margin-top:18px}
h2 small{font-size:34px;font-weight:500;color:var(--mute);margin-left:22px;letter-spacing:0;font-stretch:100%}
.lead{margin-top:16px;font-size:30px;color:var(--mute)}
.panel{border:1px solid var(--line);background:var(--fill);border-radius:4px}
.f{opacity:0;transform:translateY(16px);transition:opacity .5s var(--e),transform .5s var(--e)}
.f.on{opacity:1;transform:none}
/* chaîne */
.ch{display:flex;align-items:center;gap:16px;margin-top:26px}
.ch span{padding:12px 24px;border:1px solid var(--a);background:var(--al);border-radius:4px;font-size:26px;font-weight:600}
.ch em{font-style:normal;color:var(--a);font-size:34px}
/* trois colonnes = trois voix */
.cols{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:40px;margin-top:28px}
.col{padding:24px 30px;border-top:4px solid var(--a);overflow:hidden}
.rl{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.rl b{font-size:64px;line-height:1;color:var(--a);font-weight:800}
.rl span{font-size:33px;font-weight:800}
.rl i{width:100%;font-style:normal;font-size:22px;color:var(--dim);font-family:var(--mono)}
.col ul,.col ol{list-style:none;font-size:25px;line-height:1.33;color:#d8d8dc;counter-reset:n}
.col li{padding:7px 0 7px 34px;position:relative}
.col ul li::before{content:"";position:absolute;left:0;top:18px;width:10px;height:10px;background:var(--a)}
.col ol li{counter-increment:n}
.col ol li::before{content:counter(n);position:absolute;left:0;top:6px;font:600 22px var(--mono);color:var(--a)}
.col h4{font-size:21px;letter-spacing:.07em;text-transform:uppercase;color:var(--a);margin:4px 0 4px}
.col p{font-size:25px;line-height:1.33;color:#d8d8dc;margin-bottom:14px}
.key{margin-top:24px;padding:20px 34px;border-left:6px solid var(--a);background:var(--al);font-size:30px;line-height:1.3}
.key b{font-weight:700}.key span{color:#ddd}
/* titre / fin */
.tt,.te{justify-content:center}.tt::before,.te::before{display:none}
.tt .m{color:var(--a);font-size:30px;font-weight:600;margin-bottom:28px}
.tt h1{font-size:230px;line-height:.88;font-weight:800;font-stretch:125%;letter-spacing:-.05em;margin-left:-8px}
.tt .sub{margin-top:40px;font-size:54px;font-weight:600}
.tt .meta{position:absolute;left:120px;bottom:84px;border-left:4px solid var(--a);padding-left:26px;font-size:27px;line-height:1.5;color:var(--mute)}
.meta b{color:var(--ink);font-weight:600}
.te h2{font-size:190px;line-height:.95;font-stretch:120%;letter-spacing:-.045em}.te .sub{margin-top:28px;font-size:46px;color:var(--mute)}
/* familles */
.plan{display:grid;grid-template-columns:repeat(3,1fr);gap:48px;margin-top:44px}
.pc{padding:36px 40px;border-top:4px solid var(--a)}
.pc .pn{font-size:100px;line-height:1;font-weight:800;color:var(--a);display:block}
.pc h3{margin-top:12px;font-size:44px;font-weight:800}
.pc ul{margin-top:22px;list-style:none;font-size:30px;color:var(--mute)}
.pc li{padding:9px 0 9px 28px;position:relative}.pc li::before{content:"";position:absolute;left:0;top:23px;width:10px;height:10px;background:var(--a)}
.pc p{margin-top:20px;font-size:26px;color:var(--dim)}
/* tableau */
table{width:100%;border-collapse:collapse;font-size:27px;margin-top:30px}
th{text-align:left;color:var(--dim);font-size:21px;text-transform:uppercase;letter-spacing:.06em;padding:10px 16px;border-bottom:1px solid var(--line)}
td{padding:11px 16px;border-bottom:1px solid var(--line)}
td:first-child{font-weight:700;border-left:6px solid var(--a)}
tr.f{transform:none}
/* parades */
.pr{display:grid;grid-template-columns:repeat(3,1fr);gap:48px;margin-top:40px}
.pr h3{font-size:46px;font-weight:800;color:var(--a)}.pr small{display:block;margin:6px 0 22px;font-size:26px;color:var(--mute)}
.it{padding:22px 28px;margin-bottom:16px;font-size:29px}
/* interface */
#foot{position:absolute;left:120px;right:120px;bottom:34px;display:flex;font-size:24px;color:var(--dim);z-index:5;transition:opacity .4s}
#foot span{flex:1}#fwho{text-align:center;color:var(--mute)}#fnum{text-align:right;font-family:var(--mono);font-size:22px}
body.nf #foot{opacity:0}
#bar{position:absolute;left:0;bottom:0;height:5px;width:0;background:linear-gradient(90deg,#e5252a,#3fb8d6,#f0b429);transition:width .6s var(--e);z-index:6}
#nav{position:fixed;right:14px;bottom:14px;display:flex;gap:8px;opacity:.3;z-index:20}#nav:hover{opacity:1}
#nav button{width:44px;height:44px;border:1px solid var(--line);background:#111;color:#fff;font-size:24px;border-radius:50%;cursor:pointer}
#ov{position:absolute;inset:0;background:rgba(0,0,0,.95);z-index:9;display:none;padding:70px 120px}#ov.on{display:block}
#ov h3{font-size:44px;margin-bottom:10px}#ov p{color:var(--dim);font-size:24px;margin-bottom:30px}
#ovg{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
#ovg button{padding:18px 20px;text-align:left;font:600 25px var(--sans);color:#fff;background:var(--fill);border:1px solid var(--line);border-radius:4px;cursor:pointer}
#ovg button b{font:400 21px var(--mono);color:var(--dim);display:block;margin-bottom:6px}
</style>
</head>
<body>
<div id="stage">
<div id="deck"></div>
<div id="foot"><span id="fsec"></span><span id="fwho"></span><span id="fnum"></span></div>
<div id="bar"></div>
<div id="ov"><h3>Aller à une diapositive</h3><p>→ avancer · ← reculer · G aperçu · F plein écran</p><div id="ovg"></div></div>
</div>
<div id="nav"><button id="bp" aria-label="Précédent">‹</button><button id="bn" aria-label="Suivant">›</button></div>

 ["Il infecte des machines via un logiciel malveillant ou un mot de passe par défaut","Il se constitue un réseau de zombies","Il donne l'ordre d'attaquer tous en même temps","Le flot vient de milliers d'adresses différentes : impossible à bloquer"],

const li=a=>a.map(x=>`<li>${x}</li>`).join("");
let H=`<section class="slide fr tt" data-t="Les attaques" data-sec="Introduction" data-nf="1"><p class="m">Mission 6 · Vos premiers pas dans la cybersécurité</p><h1>Les<br>attaques</h1><p class="sub">Neuf attaques, trois familles</p><div class="meta"><div><b>${C.a1}</b>, <b>${C.a2}</b> et <b>${C.a3}</b></div><div>BTS CIEL option Informatique et Réseaux, 1re année</div><div>Cité scolaire Brocéliande · ${C.date}</div></div></section>`;

[[ "fr","Saturer",["DoS","DDoS et zombies","TCP SYN flood"],"Rendre un service indisponible"],["fb","Écouter et usurper",["Sniffing","Spoofing","Man-in-the-Middle"],"Voir ou détourner les échanges"],["fy","Infiltrer",["Zero-day","Watering hole","Keylogger"],"Entrer et voler des données"]].map((f,i)=>`<article class="pc ${f[0]} panel f" data-s="${i+1}"><span class="pn">${i+1}</span><h3>${f[1]}</h3><ul>${li(f[2])}</ul><p>${f[3]}</p></article>`).join("")+`</div></section>`;

 H+=`<section class="slide ${f[0]}" data-t="${a[1]}" data-sec="${f[1]}" data-atk="1"><div><span class="tag">${f[1]}</span><h2>${a[1]}<small>${a[2]}</small></h2></div><div class="ch">${a[3].map(x=>`<span>${x}</span>`).join("<em>›</em>")}</div><div class="cols">`+

(()=>{
const $=s=>document.querySelector(s),st=$("#stage"),S=[...document.querySelectorAll(".slide")],N=S.length;
